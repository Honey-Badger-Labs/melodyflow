/* ── Nocturne tokens (from the design system) ───────────────────────────── */
:root{
  --color-bg:#161826; --color-surface:#232532; --color-text:#e9e9ed;
  --color-accent:#9184d9; --color-accent-2:#a7a1db;
  --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
  --color-neutral-100:#f3f5fe; --color-neutral-200:#e4e7f5; --color-neutral-300:#cfd3e5;
  --color-neutral-400:#b2b6ca; --color-neutral-500:#9397ab; --color-neutral-600:#75798c;
  --color-neutral-700:#595d6c; --color-neutral-800:#3f424d; --color-neutral-900:#292b31;
  --color-accent-100:#f5f4ff; --color-accent-200:#e7e5fe; --color-accent-300:#d2cefd;
  --color-accent-400:#b5abfc; --color-accent-500:#968ae0; --color-accent-600:#796cbf;
  --color-accent-700:#5d5294; --color-accent-800:#423a6a; --color-accent-900:#2b2741;
  --font-heading:"Inter",system-ui,sans-serif; --font-body:"Inter",system-ui,sans-serif;
  --radius-sm:4px; --radius-md:8px; --radius-lg:14px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f1018;font-family:var(--font-body);-webkit-tap-highlight-color:transparent}

/* the phone-sized app shell — fills the viewport on a phone, centred on desktop */
#phone{
  position:relative;width:100%;max-width:440px;height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 62% at 50% -10%,#252a4d 0%,transparent 60%),var(--color-bg);
  color:var(--color-text);-webkit-user-select:none;user-select:none;

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   MelodyFlow — 13-note C-major tongue-drum songbook.
   Standalone port of the Nocturne redesign (MelodyFlow.dc.html).
   Static, offline, no server. State persists to localStorage.
   ════════════════════════════════════════════════════════════════════════ */

/* ── music theory / notation ─────────────────────────────────────────────
   The drum is one instrument among others now; its theory and the notation
   grammar both live in instruments.js so the ukulele can share them. What
   stays here is the drum's own views — the pad wheel, the octave dots, the
   editor's pitch nudge — which are about this instrument and nothing else. */
const DRUM  = MF.instrument('drum');
const DEG   = MF.DEGREE;
const RING  = DRUM.ring;                 // clockwise from twelve
const ORDER = DRUM.tokens;               // low→high, for pitch nudge
const PENT  = DRUM.pentatonic;
const NAMES = MF.DRUM_NAMES;
const A = '#9184d9';

const parts = MF.padParts;
function hz(p){ const f = DRUM.pitches(p); return f.length ? f[0] : 261.6256; }
function lenLabel(d){ return d===1?'':d===0.5?'½':d===1.5?'·':d===2?'– –':d===3?'– – –':d===4?'– – – –':String(d); }
/* The drum's views call a struck token a pad. One grammar, one local name. */
function parse(str){
  return MF.parseNotation(str).map(e => (e.bar || e.rest) ? e : {pad:e.tok, dur:e.dur, art:e.art});
}
/* A lyric line: the melody the drum plays, and optionally the chords the
   ukulele strums under it, in the same notation. The chords must add up to
   the same number of beats as the melody; playalong.js reports any that do
   not, and the smoke test fails on them. */
const L=(label,s,c)=>({label,notes:parse(s),chords:c?MF.parseNotation(c):null});

const BUILTIN=[
  // Public domain since 2016. Starts on an upbeat — "Hap-py" comes before the
  // first bar — so it carries a one-beat pickup and the strums land on "birth".
  // Pitched from G3 so the whole tune sits on the drum: the octave leap on
  // "dear" goes up to G4 rather than past the top pad.
  {id:'birthday',title:'Happy Birthday to You',cat:'Celebration',level:1,bpm:96,meter:'3/4',pickup:1,stars:0,lines:[
    L('Happy birthday to you','5.*.5 5.*.5 | 6. 5. 1 | 7.*2','0 | C*3 | G7*2'),
    L('Happy birthday to you','5.*.5 5.*.5 | 6. 5. 2 | 1*2','G7 | G7*3 | C*2'),
    L('Happy birthday, dear friend','5.*.5 5.*.5 | 5 3 1 | 7. 6.','C | C7*3 | F*2'),
    L('Happy birthday to you','4*.5 4*.5 | 3 1 2 | 1*3','F | C*2 G7 | C*3')]},
  {id:'twinkle',title:'Twinkle, Twinkle, Little Star',cat:'Nursery',level:1,bpm:84,meter:'4/4',stars:3,lines:[
    L('Twinkle, twinkle, little star','1 1 5 5 | 6 6 5*2','C*4 | F*2 C*2'),L('How I wonder what you are','4 4 3 3 | 2 2 1*2','F*2 C*2 | G7*2 C*2'),
    L('Up above the world so high','5 5 4 4 | 3 3 2*2','C*2 F*2 | C*2 G7*2'),L('Like a diamond in the sky','5 5 4 4 | 3 3 2*2','C*2 F*2 | C*2 G7*2')]},
  {id:'macdonald',title:'Old MacDonald Had a Farm',cat:'Folk',level:1,bpm:96,meter:'4/4',stars:2,lines:[
    L('Old MacDonald had a farm','1 1 1 5. | 6. 6. 5.*2'),L('E-I-E-I-O','3 3 2 2 | 1*2'),
    L('And on that farm he had a cow','1 1 1 5. | 6. 6. 5.*2'),L('E-I-E-I-O','3 3 2 2 | 1*2')]},
  {id:'frere',title:'Frère Jacques',cat:'Round',level:1,bpm:100,meter:'4/4',stars:3,lines:[
    L('Frère Jacques','1 2 3 1','C*4'),L('Frère Jacques','1 2 3 1','C*4'),L('Dormez-vous?','3 4 5*2','C*4'),
    L('Sonnez les matines','5*.5 6*.5 5*.5 4*.5 3 1','C*4'),L('Ding, ding, dong','1 5. 1*2','C G7 C*2')]},
  {id:'ode',title:'Ode to Joy',cat:'Beethoven',level:2,bpm:88,meter:'4/4',stars:2,lines:[
    L('Rising phrase','3 3 4 5','C*4'),L('and back down','5 4 3 2','G7*4'),L('Second phrase','1 1 2 3','C*4'),
    L('resting on 2','3*1.5 2*.5 2*2','C*2 G7*2'),L('Third phrase','3 3 4 5','C*4'),L('and back down','5 4 3 2','G7*4'),
    L('Fourth phrase','1 1 2 3','C*4'),L('home on 1','2*1.5 1*.5 1*2','G7*2 C*2')]},
  {id:'jingle',title:'Jingle Bells',cat:'Christmas',level:2,bpm:108,meter:'4/4',stars:1,lines:[
    L('Jingle bells, jingle bells','3 3 3*2 | 3 3 3*2','C*4 | C*4'),L('Jingle all the way','3 5 1 2 | 3*4','C*4 | C*4'),
    L('Oh what fun it is to ride','4 4 4 4 | 4 3 3 3*.5 3*.5','F*4 | C*4'),L('In a one-horse open sleigh','3 2 2 3 | 2*2 5*2','G7*4 | G7*4')]},
  {id:'saints',title:'When the Saints Go Marching In',cat:'Gospel',level:2,bpm:104,meter:'4/4',stars:2,lines:[
    L('Oh when the saints','1 3 4 5*2'),L('go marching in','1 3 4 5*2'),L('Oh when the saints go marching in','5 5 4 3 | 3 2 1'),L('Oh how I want to be in that number','3 3 2 1 | 1*2 5*2')]},
  {id:'scarborough',title:'Scarborough Fair',cat:'Dorian folk',level:2,bpm:76,meter:'3/4',stars:1,lines:[
    L('Are you going','2 2 2*2'),L('to Scarborough Fair','6 6 5 | 2*3'),L('Parsley, sage','4 3 2 | 1*3')]},
  {id:'amazing',title:'Amazing Grace',cat:'Hymn',level:2,bpm:72,meter:'3/4',stars:2,flag:'adapted',lines:[
    L('Amazing grace','5. 1*2 3*.5 1*.5 | 3*3'),L('how sweet the sound','2*3 | 1*2 5.'),L('that saved a wretch like me','5. 1*2 3*.5 1*.5 | 3*3')]},
  {id:'hedwig',title:"Hedwig's Theme",cat:'Film',level:3,bpm:88,meter:'3/4',stars:1,flag:'adapted',lines:[
    L('Opening','6. 2 4*1.5 3*.5 | 2*3'),L('Answering phrase','.2*3 | 6*3'),L('Falling','5*1.5 4*.5 3*.5 4*.5 | 2*3')]},
  {id:'terminator',title:'Terminator theme',cat:'Film · notebook',level:3,bpm:76,meter:'4/4',stars:0,flag:'timing',lines:[
    L('The figure','1 1 5. 1 | 1 1 5. 1'),L('Answer','1 1 5. 1 | 7. 1*2')]},
  {id:'lowrider',title:'Low Rider',cat:'Funk · notebook',level:3,bpm:92,meter:'4/4',stars:0,flag:'timing',lines:[
    L('The hook','5 5 5 6 | 5*2 3*2'),L('Again','5 5 5 6 | 5*2 1*2')]},
  {id:'cant',title:"Can't Help Falling in Love",cat:'Ballad · notebook',level:3,bpm:68,meter:'4/4',stars:1,flag:'timing',lines:[
    L('Wise men say','1 3 5 .1*2'),L('only fools rush in','7 5 6 5*2')]},
  {id:'homealone',title:'Somewhere in My Memory',cat:'Film · notebook',level:3,bpm:80,meter:'3/4',stars:0,flag:'timing',lines:[
    L('Opening','5 .1*2 | 7 .1 5'),L('Answer','6 5*2 | 3*3')]}
];
/* The book as shown: the built-ins, your corrections in their place, then
   the songs that are only yours. Rebuilt by App.refreshSongs(). */
let SONGS=BUILTIN.slice();

/* Progressions, not songs: what a learner actually drills. Each is solved
   for the cheapest way through it, so the shapes shown are the ones that
   keep the most fingers down — which is not what a chord chart prints. */
const PROGS=[
  {id:'fifties', name:'The fifties turnaround', sub:'Heart and Soul, Stand By Me, half of doo-wop', chords:['C','Am','F','G7']},
  {id:'three',   name:'Three chords',           sub:'Where nearly every folk song lives',          chords:['C','F','G7','C']},
  {id:'pop',     name:'The pop four',           sub:'Axis of Awesome, and you know the rest',      chords:['Am','F','C','G']},
  {id:'gfamily', name:'The G family',           sub:'Friendlier shapes, one barre to dodge',       chords:['G','Em','C','D7']},
  {id:'minor',   name:'A minor turn',           sub:'Slower songs, and the sound of a sad uke',    chords:['Am','Dm','G7','C']}
];

const REGISTER=[
  {t:'Scarborough Fair',v:'in',r:'Dorian, so home is 2 rather than 1. Sits inside C4–D5 with nothing changed.'},
  {t:'Old MacDonald Had a Farm',v:'corrected',r:'Corrected, not adapted — "had a farm" drops below the tonic to 5. 6. 6. 5. An earlier version had it an octave too high.'},
  {t:"Hedwig's Theme",v:'adapted',r:'Overturned on request. In A minor the opening eight notes are exact on white notes; only the answering phrase substitutes.'},
  {t:'Low Rider',v:'adapted',r:'Overturned. Ruled out for needing blues notes, but your notebook has a diatonic version that plays as written.'},
  {t:'Greensleeves',v:'out',r:'Wants G♯ at every cadence and alternates F with F♯. Four or five notes would have to change — past adaptation, into a different tune.'},
  {t:'Stairway to Heaven',v:'out',r:'The intro is a chromatic descent A–G♯–G–F♯–F–E. Two of those notes do not exist here, and the descent is the piece.'},
  {t:'Canon in D',v:'queued',r:'Transposes to C cleanly. The open question is range, not key.'},
  {t:'O Christmas Tree',v:'queued',r:'Asked for, not yet sourced. I know the shape but not the passing notes with enough confidence.'}
];
const VC={in:['#4d7a68','#8fd0b4'],corrected:['#5d5294','#d2cefd'],adapted:['#5d5294','#d2cefd'],out:['#7a4a52','#e0a8b0'],queued:['#595d6c','#9397ab']};

/* fixed design props (canvas-editable in the prototype, constants here) */
const PROPS={bigNumbers:true, showLyrics:true, drumRotation:0};

/* ── tiny escaping helper for interpolated text ─────────────────────────── */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ════════════════════════════════════════════════════════════════════════
   App — state, audio engine, sequencing, rendering
   ════════════════════════════════════════════════════════════════════════ */
const App = {
  state:{
    tab:'play', screen:'library', filter:'all', songId:'twinkle', line:0,
    cur:-1, playing:false, playScope:null, beat:0, lit:null, tempo:84, mode:'guided',
    armed:false, armScope:null, armItems:[], armIdx:0,
    drumMode:'free', drone:false, rec:'idle', hasCap:false, book:'score',
    inst:'drum', ukeMode:'changes', ukeChord:'C', progId:'fifties', step:1,
    drillBpm:90, drillKey:null, drillLive:false, drillLast:null,
    edNotes:[], edTitle:'', edSub:'', edCtx:null, sel:0, rot:0,
    ukeSong:'along', strum:'downs', uCi:-1, uT:0, count:0, ukeDone:false,
    toast:'', bookMsg:'',
    tapMsg:'Terminator is really in 13/8. Tap four bars and I will re-bar it.'
  },

  /* ---- persistence (progress + preferences only) ---- */
  load(){
    try{
      const s=JSON.parse(localStorage.getItem('melodyflow')||'{}');
      ['songId','line','tempo','rot','mode','drumMode','filter','book','inst','ukeMode','ukeChord','progId','drillBpm','ukeSong','strum'].forEach(k=>{
        if(s[k]!==undefined) this.state[k]=s[k];
      });
      // The decks are kept apart: they are the only thing here a learner would
      // be sorry to lose, and they grow, while everything above is a toggle.
      this.decks=JSON.parse(localStorage.getItem('melodyflow-drill')||'{}');
      // Songs you wrote or corrected. Kept apart again, and for the same reason.
      const saved=JSON.parse(localStorage.getItem('melodyflow-songs')||'[]');
      this.saved=Array.isArray(saved)?saved.map(MF_SONGBOOK.clean).filter(Boolean):[];
      this.refreshSongs();
      if(!SONGS.some(x=>x.id===this.state.songId)){ this.state.songId='twinkle'; this.state.line=0; }
    }catch(e){}
  },
  save(){
    const s=this.state, keep={songId:s.songId,line:s.line,tempo:s.tempo,rot:s.rot,mode:s.mode,drumMode:s.drumMode,filter:s.filter,book:s.book,inst:s.inst,ukeMode:s.ukeMode,ukeChord:s.ukeChord,progId:s.progId,drillBpm:s.drillBpm,ukeSong:s.ukeSong,strum:s.strum};
    try{ localStorage.setItem('melodyflow',JSON.stringify(keep)); }catch(e){}
    try{ localStorage.setItem('melodyflow-drill',JSON.stringify(this.decks||{})); }catch(e){}
  },

  setState(patch){ Object.assign(this.state,patch); this.render(); this.save(); },

  /* ---- your songbook ----
     Saved songs are text (songbook.js); the book is rebuilt from the
     built-ins and them whenever either changes. */
  refreshSongs(){
    const hydrate=x=>Object.assign({},x,{stars:x.stars||0,lines:x.lines.map(l=>L(l.label,l.notes,l.chords))});
    SONGS=MF_SONGBOOK.merge(BUILTIN,this.saved||[]).map(e=>
      e.edited? Object.assign(hydrate(e.song),{edited:true,stars:e.original.stars,flag:e.original.flag})
      : e.custom? Object.assign(hydrate(e.song),{custom:true})
      : e.song);
    this._plan=null;
  },
  saveSongs(){
    try{ localStorage.setItem('melodyflow-songs',JSON.stringify(this.saved||[])); }
    catch(e){ this.flash('Could not save — this phone is out of room for the app.'); }
    this.refreshSongs();
  },
  flash(msg){
    this.state.toast=msg; clearTimeout(this._toastT);
    this._toastT=setTimeout(()=>{ this.state.toast=''; this.renderToast(); },2600);
    this.renderToast();
  },
  saveEdit(){
    const st=this.state, B=MF_SONGBOOK, ctx=st.edCtx||{kind:'capture'};
    const notes=st.edNotes.map(n=>n.bar?{bar:true}:n.rest?{rest:true,dur:n.dur}:{pad:n.pad,dur:n.dur});
    if(!notes.some(n=>!n.bar&&!n.rest)){ this.setState({tapMsg:'Nothing to save yet — there are no notes in it.'}); return; }
    if(ctx.kind==='line'){
      const song=SONGS.find(x=>x.id===ctx.songId); if(!song) return;
      const ser=B.serialize(song);
      ser.lines[ctx.line]=Object.assign({},ser.lines[ctx.line],{notes:B.write(notes)});
      if(st.edTitle&&st.edTitle!==song.title) ser.title=st.edTitle;
      this.saved=B.upsert(this.saved,ser); this.saveSongs();
      this.setState({screen:st.tab==='play'?'practice':st.tab,songId:song.id,line:ctx.line,cur:-1});
    } else {
      const n=(this.saved||[]).filter(x=>x.custom).length+1;
      const title=(st.edTitle&&st.edTitle!=='Untitled capture')?st.edTitle:'My song '+n;
      const ser={id:'my-'+Date.now().toString(36),title,cat:'My songs',level:1,bpm:84,meter:'4/4',custom:true,
                 lines:[{label:'Line 1',notes:B.write(notes)}]};
      this.saved=B.upsert(this.saved,ser); this.saveSongs();
      this.setState({tab:'play',screen:'practice',songId:ser.id,line:0,cur:-1});
    }
    this.flash('Saved to your songbook.');
  },
  /* The whole book as one file. On a phone that is the share sheet — save to
     Files, AirDrop, email it to yourself; elsewhere, a download. */
  exportBook(){
    const data=JSON.stringify(MF_SONGBOOK.bundle({songs:this.saved||[],drill:this.decks||{}}),null,2);
    const name='melodyflow-songbook-'+new Date().toISOString().slice(0,10)+'.json';
    let file=null;
    try{ file=new File([data],name,{type:'application/json'}); }catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'MelodyFlow songbook'}).catch(()=>{});
    } else {
      const a=document.createElement('a');
      a.href=URL.createObjectURL(file||new Blob([data],{type:'application/json'}));
      a.download=name; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    }
    this.setState({bookMsg:'Saved a copy of '+((this.saved||[]).length)+' song'+((this.saved||[]).length===1?'':'s')+' and your drill times.'});
  },
  importBook(file){
    if(!file) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const got=MF_SONGBOOK.unbundle(String(r.result));
        this.saved=MF_SONGBOOK.absorb(this.saved,got.songs);
        this.decks=Object.assign({},this.decks||{},got.drill);
        this.saveSongs();
        this.setState({bookMsg:'Loaded '+got.songs.length+' song'+(got.songs.length===1?'':'s')+(Object.keys(got.drill).length?' and your drill times':'')+'.'+(got.skipped?' '+got.skipped+' could not be read and were left out.':'')});
      }catch(e){ this.setState({bookMsg:e.message}); }
    };
    r.onerror=()=>this.setState({bookMsg:'That file could not be opened.'});
    r.readAsText(file);
  },

  /* ---- audio ---- */
  ac(){ if(!this._ac) this._ac=new (window.AudioContext||window.webkitAudioContext)();
        if(this._ac.state==='suspended') this._ac.resume(); return this._ac; },
  tone(f,dur,gain,partials){
    try{
      const ac=this.ac(), t=ac.currentTime, g=ac.createGain();
      g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22*(gain===undefined?1:gain),t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      (partials||[[1,1],[2.02,0.3],[3.01,0.1],[5.43,0.035]]).forEach(m=>{
        const o=ac.createOscillator(), gg=ac.createGain();
        o.type='sine'; o.frequency.value=f*m[0]; gg.gain.value=m[1];
        o.connect(gg); gg.connect(g); o.start(t); o.stop(t+dur);
      });
    }catch(e){}
  },
  /* A token on any instrument: one strike for a pad, four fanned out for a
     strum. The offsets are the instrument's, not this function's. */
  playToken(instId,tok,art){
    const inst=MF.instrument(instId);
    MF.strikes(inst,{tok,dur:1,art:art||null}).forEach(k=>{
      const fire=()=>this.tone(k.hz,k.ring,k.gain,inst.voice.partials);
      k.atMs? setTimeout(fire,k.atMs) : fire();
    });
  },
  /* The chords of a progression, in the order the solver chose them. */
  prog(){ return PROGS.find(p=>p.id===this.state.progId)||PROGS[0]; },
  progPath(){
    const p=this.prog();
    if(this._pathId!==p.id){ this._pathId=p.id; this._path=MF.instrument('ukulele').easiestPath(p.chords); }
    return this._path;
  },
  /* One deck per progression, kept across sessions. A deck outlives a tempo
     change: the times stand, the pass mark moves. */
  deck(){
    const id=this.state.progId;
    this.decks=this.decks||{};
    if(!this.decks[id]) this.decks[id]=MF_PRACTICE.deckFor(this.prog().chords,{bpm:this.state.drillBpm});
    this.decks[id].bpm=this.state.drillBpm;
    return this.decks[id];
  },
  /* The two shapes for a change, taken from the solved progression so the
     drill teaches the same fingers the Changes screen showed. */
  drillPair(k){
    const n=this.progPath(); if(!n) return null;
    const cs=this.prog().chords;
    for(let i=0;i<cs.length;i++){
      if(cs[i]+'>'+cs[(i+1)%cs.length]===k) return [n.shapes[i],n.shapes[(i+1)%cs.length]];
    }
    return null;
  },
  drillNext(){
    const k=MF_PRACTICE.next(this.deck());
    this._shownAt=performance.now();
    this.setState({drillKey:k,drillLive:true});
  },
  drillTap(){
    const st=this.state;
    if(!st.drillLive||!st.drillKey) return this.drillNext();
    const ms=Math.round(performance.now()-this._shownAt);
    const d=this.deck(), target=MF_PRACTICE.targetMs(d.bpm,d.beats);
    this.decks[st.progId]=MF_PRACTICE.record(d,st.drillKey,ms);
    const pair=this.drillPair(st.drillKey);
    if(pair) this.playToken('ukulele',pair[1].chord,'d');
    this.setState({drillLive:false,drillLast:{key:st.drillKey,ms,verdict:MF_PRACTICE.grade(ms,target)}});
  },
  strike(p){
    this.tone(hz(p),1.6);
    const st=this.state;
    // solo practice: only the correct next pad advances the line/song
    if(st.armed && st.screen==='practice' && st.armItems && st.armItems.length){
      const tgt=st.armItems[st.armIdx];
      if(tgt && p===tgt.pad){
        const next=st.armIdx+1;
        clearTimeout(this._litT);
        if(next<st.armItems.length){
          const n=st.armItems[next];
          this.setState({armIdx:next, line:n.li, cur:n.idx, lit:p});
        } else {
          this.setState({armed:false,armScope:null,armItems:[],armIdx:0,cur:-1,lit:p});
        }
        this._litT=setTimeout(()=>this.setState({lit:null}),240);
        return;
      }
    }
    this.setState({lit:p});
    clearTimeout(this._litT); this._litT=setTimeout(()=>this.setState({lit:null}),240);
  },

  /* ---- song helpers ---- */
  song(){ return SONGS.find(s=>s.id===this.state.songId)||SONGS[0]; },
  lineNotes(){ const l=this.song().lines[this.state.line]; return l?l.notes:[]; },
  itemsForLine(li){ const l=this.song().lines[li]; if(!l) return [];
    return l.notes.map((n,idx)=>({n,li,idx})).filter(x=>!x.n.bar); },
  itemsForSong(){ const out=[]; this.song().lines.forEach((l,li)=>l.notes.forEach((n,idx)=>{ if(!n.bar) out.push({n,li,idx}); })); return out; },
  startSolo(scope){
    const items = scope==='song'? this.itemsForSong(): this.itemsForLine(this.state.line);
    if(!items.length) return;
    const armItems = items.map(x=>({li:x.li, idx:x.idx, pad:x.n.pad}));
    const f = armItems[0];
    this._stopped=true; clearTimeout(this._seqT); clearInterval(this._beatT);
    this.setState({armed:true, armScope:scope, armItems, armIdx:0, line:f.li, cur:f.idx, playing:false, playScope:null, beat:0, lit:null});
  },

  /* ---- the ukulele play-along ----
     One plan per song (playalong.js) says when every chord and strum falls.
     The shapes are solved for the song's whole run of changes, so the
     fingers that can stay down between chords are shown staying down. */
  hasUke(s){ return !!s && s.lines.some(l=>l.chords&&l.chords.length); },
  ukePlan(){
    const s=this.song(), k=s.id+'|'+this.state.strum;
    if(!this._plan||this._planKey!==k){ this._planKey=k; this._plan=MF_PLAYALONG.plan(s,{strum:this.state.strum}); this._shapes=null; }
    return this._plan;
  },
  ukeShapes(){
    const p=this.ukePlan();
    if(!this._shapes){
      const uke=MF.instrument('ukulele'), names=p.groups.map(g=>g.chord);
      const path=names.length?uke.easiestPath(names,{chart:true}):null;
      this._shapes=names.map((n,i)=>(path&&path.shapes[i])||uke.shapesFor(n)[0]||null);
    }
    return this._shapes;
  },
  /* Where the play-along is: the beat, and the chord sounding there. Before
     anything has played, the start of the current line. */
  ukeWhere(){
    const st=this.state, p=this.ukePlan(), P=MF_PLAYALONG;
    const ln=p.lines[st.line]||p.lines[0]||{t:0,dur:0};
    const t=st.uCi>=0?st.uT:ln.t;
    let ci=P.chordAt(p.chords,t);
    if(ci<0) ci=p.chords.findIndex(c=>c.t>=t);
    return {p,t,ci,gi:ci>=0?p.groupOf[ci]:-1,ln};
  },
  click(down,gain){ this.tone(down?1760:1320,0.05,gain===undefined?0.7:gain,[[1,1]]); },
  lineRange(scope){
    const p=this.ukePlan(), ln=p.lines[this.state.line]||p.lines[0];
    return scope==='song'?[0,p.total]:[ln.t,ln.t+ln.dur];
  },
  /* Listen: the app strums and plays the tune. Along: it plays the tune and
     the click, and you strum. Either way one bar is counted in first. */
  runUke(scope,how){
    const st=this.state, p=this.ukePlan(), [a,b]=this.lineRange(scope);
    const bpm=how==='listen'?Math.round(st.tempo*0.8):st.tempo, beatMs=60000/bpm, lead=p.meter, E=1e-6;
    const ev=[], rank={count:0,click:1,stroke:2,note:3,end:4};
    for(let i=0;i<lead;i++) ev.push({t:a-lead+i,kind:'count',n:lead-i});
    p.strokes.forEach(x=>{ if(x.t>=a-E&&x.t<b-E) ev.push({t:x.t,kind:'stroke',x}); });
    p.melody.forEach(n=>{ if(n.t>=a-E&&n.t<b-E) ev.push({t:n.t,kind:'note',n}); });
    if(how==='along') p.clicks.forEach(c=>{ if(c.t>=a-E&&c.t<b-E) ev.push({t:c.t,kind:'click',c}); });
    ev.push({t:b,kind:'end'});
    ev.sort((x,y)=>x.t-y.t||rank[x.kind]-rank[y.kind]);

    this._stopped=true; clearTimeout(this._seqT); clearInterval(this._beatT);
    this._stopped=false;
    const t0=performance.now()+80, when=t=>t0+(t-(a-lead))*beatMs;
    let i=0;
    this.setState({playing:true,playScope:scope,armed:false,count:lead,uT:a,uCi:-1,ukeDone:false});
    const tick=()=>{
      if(this._stopped) return;
      const now=performance.now(); let patch=null;
      while(i<ev.length&&when(ev[i].t)<=now+4){
        const e=ev[i++];
        if(e.kind==='count'){ this.click(e.n===lead); patch=Object.assign(patch||{},{count:e.n}); }
        else if(e.kind==='click'){ this.click(e.c.down,0.35); }
        else if(e.kind==='note'){ this.tone(hz(e.n.tok),Math.min(2,e.n.dur*beatMs/1000+0.3),how==='listen'?0.8:0.5);
          if(e.n.li!==this.state.line||this.state.count) patch=Object.assign(patch||{},{line:e.n.li,count:0}); }
        else if(e.kind==='stroke'){ if(how==='listen') this.playToken('ukulele',e.x.chord,e.x.art);
          patch=Object.assign(patch||{},{count:0,uT:e.x.t,uCi:e.x.ci,line:p.chords[e.x.ci].li}); }
        else if(e.kind==='end'){ clearInterval(this._beatT); this.setState({playing:false,playScope:null,count:0}); return; }
      }
      if(patch) this.setState(patch);
      if(i<ev.length) this._seqT=setTimeout(tick,Math.max(0,when(ev[i].t)-performance.now()));
    };
    this._beatT=setInterval(()=>{
      const t=(performance.now()-t0)/beatMs+(a-lead), ln=p.lines[this.state.line];
      if(ln&&ln.dur) this._beat(Math.max(0,Math.min(1,(t-ln.t)/ln.dur)));
    },45);
    tick();
  },
  /* On your own: nothing moves until you do. Each chord change waits for a
     tap — make the shape, strum it, tap. The listening step will replace the
     tap with the microphone. */
  startUkeSolo(scope){
    const p=this.ukePlan(), [a,b]=this.lineRange(scope), E=1e-6;
    const items=p.groups.map((g,gi)=>gi).filter(gi=>p.groups[gi].end>a+E&&p.groups[gi].t<b-E);
    if(!items.length) return;
    const g=p.groups[items[0]];
    this._stopped=true; clearTimeout(this._seqT); clearInterval(this._beatT);
    this.setState({armed:true,armScope:scope,armItems:items,armIdx:0,uCi:g.first,uT:Math.max(a,g.t),
                   line:p.chords[g.first].li,playing:false,playScope:null,count:0,ukeDone:false});
  },
  ukeTap(){
    const st=this.state, w=this.ukeWhere();
    if(!st.armed){ if(w.ci>=0) this.playToken('ukulele',w.p.chords[w.ci].chord,'d'); return; }
    const p=w.p, cur=p.groups[st.armItems[st.armIdx]];
    this.playToken('ukulele',cur.chord,'d');
    const next=st.armIdx+1;
    if(next<st.armItems.length){
      const g=p.groups[st.armItems[next]];
      this.setState({armIdx:next,uCi:g.first,uT:g.t,line:p.chords[g.first].li});
    } else {
      this.setState({armed:false,armScope:null,armItems:[],armIdx:0,ukeDone:true});
    }
  },

  /* ---- sequencing ---- */
  stop(){ this._stopped=true; clearTimeout(this._seqT); clearInterval(this._beatT);
          this.setState({playing:false,playScope:null,cur:-1,beat:0,lit:null,armed:false,armScope:null,armItems:[],armIdx:0,count:0,uCi:-1}); },
  _beat(p){ this.state.beat=p; const el=document.getElementById('mf-beat'); if(el) el.style.width=Math.round(p*100)+'%'; },
  run(items,bpm,scope,even){
    this._stopped=false;
    const beatMs=60000/bpm; let i=0;
    const step=()=>{
      if(this._stopped) return;
      const it=items[i];
      if(!it){ this.setState({playing:false,playScope:null,cur:-1,beat:0,lit:null}); return; }
      const n=it.n, ms=(even?1:n.dur)*beatMs, t0=performance.now();
      const gap=(items[i+1]&&items[i+1].li!==it.li)?380:0;
      this.setState({line:it.li,cur:it.idx,playing:true,playScope:scope||'line',lit:n.pad||null,beat:0});
      if(n.pad) this.tone(hz(n.pad),Math.min(2.2,ms/1000+0.4));
      clearInterval(this._beatT);
      this._beatT=setInterval(()=>{
        const p=Math.min(1,(performance.now()-t0)/ms);
        this._beat(p); if(p>=1) clearInterval(this._beatT);
      },45);
      i++; this._seqT=setTimeout(step,ms+gap);
    };
    step();
  },

  /* ---- capture + editor ---- */
  capNotes(){ if(!this._cap) this._cap=parse('1 1 5 5 | 6 6 5*2 | 4 4 3*2'); return this._cap; },
  openEditor(title,notes,sub,ctx){
    const n=notes.map(x=>Object.assign({},x));
    this.setState({screen:'editor',edTitle:title,edSub:sub,edCtx:ctx||null,edNotes:n,sel:n.findIndex(x=>!x.bar)});
  },
  patch(fn){ const ns=this.state.edNotes.slice(); fn(ns,this.state.sel); this.setState({edNotes:ns}); },

  /* ---- pad-wheel geometry (radial rounded tongues in a 0 0 400 400 viewBox) ---- */
  padList(opts){
    const st=this.state, out=[];
    const n=RING.length, w=43, h=80, fs=24, R=140, stepDeg=360/n;
    const mk=(pad,cx,cy,deg,W,H,FS)=>{
      const q=parts(pad), on=st.lit===pad, tgt=opts.target===pad;
      const dim=opts.dim && opts.dim.indexOf(pad)<0;
      const oct=q.up?1:q.dn?-1:0;
      // octave-coded number colour — mint high, amber low, light neutral middle
      const octCol = q.up ? '#8fd0b4' : q.dn ? '#e6ca9c' : '#e2e5f0';
      out.push({
        pad, num:q.num, w:W, h:H, rx:W/2,
        x:cx-W/2, y:cy-H/2,
        lx:(cx/400)*100+'%', ly:(cy/400)*100+'%',
        cqFs:FS/4, // font size as % of the 400 viewBox, applied in container-query width units
        tr:'rotate('+deg+' '+cx+' '+cy+')',
        fill:on?A:tgt?'#3b336b':'#2e3145',
        stroke:on?'#c7c0f2':tgt?A:'#15171f',
        fg:on?'#171927':octCol,
        dotUp:oct>0, dotDn:oct<0, op:dim?0.3:1
      });
    };
    RING.forEach((pad,i)=>{
      const deg=((i+(opts.rot||0))*stepDeg+360)%360, a=deg*Math.PI/180;
      mk(pad,200+R*Math.sin(a),200-R*Math.cos(a),deg,w,h,fs);
    });
    mk('5.',200,200,0,92,92,27);
    return out;
  },

     Rendering

  screenPractice(){
    const st=this.state, s=this.song(), notes=this.lineNotes();
    const big=PROPS.bigNumbers;
    const rotSteps=Math.round((PROPS.drumRotation+st.rot)/30);
    const idxNow=st.cur>=0?st.cur:notes.findIndex(n=>!n.bar);
    const playable=notes.filter(n=>!n.bar);
    const pos=Math.max(0,notes.slice(0,Math.max(0,idxNow)).filter(n=>!n.bar).length);
    const heroNote=playable[pos]||playable[0]||{pad:'1'};
    const hq=parts(heroNote.pad||'1');
    const heroThen=playable.slice(pos+1,pos+4).map(n=>n.pad||'0').join('  ');

    const chips=notes.map((n,i)=>{
      if(n.bar) return `<div style="flex:none;width:10px;text-align:center;font-size:17px;color:var(--color-accent-800)">|</div>`;
      const q=n.pad?parts(n.pad):{num:'0',up:false,dn:false};
      const now=i===st.cur, done=st.cur>i;
      const bg=now?A:done?'#2b2741':'#232532', bc=now?A:done?'#423a6a':'#3f424d', fg=now?'#161826':done?'#d2cefd':'#9397ab';
      return `<div style="flex:none;min-width:46px;height:52px;border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s,background .15s;border:1px solid ${bc};background:${bg};color:${fg};transform:${now?'scale(1.09)':'scale(1)'}">
        <div style="display:flex;align-items:flex-start;gap:2px;line-height:.9;font:500 21px var(--font-heading)"><span>${q.num}</span>${q.up?'<span style="font-size:9px;line-height:1">•</span>':''}${q.dn?'<span style="font-size:9px;line-height:1;align-self:flex-end">•</span>':''}</div>
        <div style="font:600 8px ui-monospace,Menlo,monospace;letter-spacing:.1em;opacity:.65">${lenLabel(n.dur)}</div>
      </div>`;
    }).join('');

    const modes=[['notes','Notes only'],['guided','With rhythm'],['solo','On your own']];
    const pads=this.padList({target:heroNote.pad,rot:rotSteps});
    const solo=st.mode==='solo';
    const playLabel=solo?(st.armed&&st.armScope==='line'?'Stop':'Practise line'):((st.playing&&st.playScope==='line')?'Stop':'Play line');
    const songLabel=solo?(st.armed&&st.armScope==='song'?'Stop':'Practise song'):((st.playing&&st.playScope==='song')?'Stop':'Play whole song');
    const songBtnBg=((st.playing&&st.playScope==='song')||(st.armed&&st.armScope==='song'))?'#423a6a':'transparent';

    return `<div style="padding:0 16px 14px">
      <div style="display:flex;align-items:center;gap:10px">
        <button data-act="back" style="width:34px;height:34px;flex:none;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:var(--color-surface);color:var(--color-neutral-400);font-size:15px;cursor:pointer">‹</button>
        <div style="flex:1;min-width:0;text-align:center">
          <div style="font:500 13.5px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.title)}</div>
          <div style="font:400 10.5px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--color-neutral-600);margin-top:2px">${s.bpm} bpm · ${s.meter} · level ${s.level}</div>
        </div>
        <button data-act="editThis" style="height:34px;flex:none;padding:0 11px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:var(--color-surface);color:var(--color-neutral-400);font:500 11.5px Inter,sans-serif;cursor:pointer">Edit</button>
      </div>
      ${this.practiceInst()}

      <div style="display:flex;align-items:center;gap:16px;margin-top:14px;padding:0 4px">
        <div style="flex:none;display:flex;align-items:flex-start;gap:3px;line-height:.82;color:var(--color-accent-300);font-size:${big?'100px':'78px'}">
          <span style="font-family:var(--font-heading);font-weight:500">${hq.num}</span>
          ${hq.up?'<span style="font-size:.28em;line-height:1;margin-top:-.05em">•</span>':''}
          ${hq.dn?'<span style="font-size:.28em;line-height:1;align-self:flex-end;margin-bottom:.1em">•</span>':''}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--color-neutral-600)">${st.playing?'Now':st.armed?'Tap this':'Next'}</div>
          <div style="font:400 19px/1 Inter,sans-serif;color:var(--color-neutral-500);letter-spacing:.2em;margin-top:9px">${esc(heroThen)}</div>
          ${PROPS.showLyrics?`<div style="font:400 12.5px/1.4 Inter,sans-serif;color:var(--color-neutral-600);margin-top:9px;text-wrap:pretty">${esc(s.lines[st.line]?s.lines[st.line].label:'')}</div>`:''}
        </div>
      </div>

      <div style="margin-top:14px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)">
        <div style="display:flex;align-items:center;gap:6px;transition:transform .26s cubic-bezier(.22,.9,.3,1);transform:translateX(-${Math.max(0,idxNow-2)*52}px)">${chips}</div>
      </div>
      <div style="height:3px;border-radius:2px;background:#292b31;margin-top:8px;overflow:hidden"><div id="mf-beat" style="height:100%;background:var(--color-accent);border-radius:2px;transition:width .08s linear;width:${Math.round(st.beat*100)}%"></div></div>

      <div style="padding:10px 0">${this.wheel(pads,'min(62vw, 240px)')}</div>

      <div style="padding-bottom:8px">
        <div style="display:flex;gap:5px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${this.seg(modes,st.mode,'mode')}</div>
        ${solo?`<div style="font:400 11px/1.5 Inter,sans-serif;color:var(--color-neutral-600);margin-top:8px;text-align:center;text-wrap:pretty">${st.armed?'Tap the lit pad on the drum to move to the next note.':'Tap “Practise line”, then play it yourself on the drum. “Listen” plays it for you.'}</div>`:''}
        <div style="display:flex;align-items:center;gap:11px;margin-top:11px">
          <span style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">Tempo</span>
          <input type="range" min="50" max="126" step="2" data-act="setTempo" value="${st.tempo}" style="flex:1">
          <span style="font:500 12px ui-monospace,Menlo,monospace;color:var(--color-accent-300);width:54px;text-align:right">${st.tempo} bpm</span>
        </div>
        <div style="display:flex;gap:9px;margin-top:11px">
          <button data-act="listen" style="flex:1;height:44px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-300);font:500 14px Inter,sans-serif;cursor:pointer">Listen</button>

  /* On a song with chords: which instrument you are practising it on. */
  practiceInst(){
    const st=this.state, s=this.song();
    const restore=s.edited?`<button data-act="restoreSong" style="border:0;background:none;color:var(--color-neutral-600);font:500 11px Inter,sans-serif;cursor:pointer;padding:6px 2px 0">Edited · restore the original</button>`:'';
    if(!this.hasUke(s)) return restore?`<div style="text-align:center">${restore}</div>`:'';
