  /* The ukulele play-along. What a learner needs at every moment: the chord
     now, the chord next and how long until it, where to strum, and which
     fingers can stay down through the change. */
  screenUkePractice(){
    const st=this.state, s=this.song(), V=MF_FRETBOARD_VIEW, P=MF_PLAYALONG;
    const w=this.ukeWhere(), p=w.p, shapes=this.ukeShapes();
    const cur=w.gi>=0?shapes[w.gi]:null, prev=w.gi>0?shapes[w.gi-1]:null;
    const nx=w.gi>=0&&w.gi+1<p.groups.length?w.gi+1:-1, next=nx>=0?shapes[nx]:null;
    const inBeats=nx>=0?p.groups[nx].t-Math.max(w.t,p.groups[w.gi].t):0;
    const beatsTxt=b=>{ const r=Math.round(b*2)/2; return (r===1?'1 beat':(String(r).replace('.5','½'))+' beats'); };
    const anchors=(cur&&next)?next.placements.filter(q=>V.anchored(q,cur)).length:0;
    const solo=st.ukeSong==='solo';

    const heroKicker=st.count?`Count in · ${st.count}`:st.armed?'Make it, strum it, tap it':st.playing?'Now':'First chord';
    const hero=cur?`<div data-act="ukeTap" style="flex:1.25;min-width:0;padding:10px 10px 8px;border-radius:var(--radius-lg);cursor:pointer;border:1px solid ${st.armed?'var(--color-accent)':'var(--color-neutral-900)'};background:${st.armed?'#241f3d':'var(--color-surface)'}">
        <div style="font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:${st.count?'var(--color-accent-300)':'var(--color-neutral-600)'};text-align:center">${heroKicker}</div>
        <div style="max-width:150px;margin:6px auto 0">${V.chord(cur,{from:prev,label:cur.chord})}</div>
      </div>`:'';
    const upNext=next?`<div style="flex:1;min-width:0;padding:10px 10px 8px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-900);background:var(--color-surface);opacity:.85">
        <div style="font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600);text-align:center">${solo?'Then':'Next · in '+beatsTxt(inBeats)}</div>
        <div style="max-width:112px;margin:6px auto 0">${V.chord(next,{from:cur,label:next.chord})}</div>
        <div style="text-align:center;font:400 10.5px/1.35 Inter,sans-serif;color:${anchors?'#8fd0b4':'var(--color-neutral-600)'};margin-top:4px">${anchors===0?'Whole hand moves':anchors===1?'1 finger stays':anchors+' fingers stay'}</div>
      </div>`:`<div style="flex:1;min-width:0;padding:10px;border-radius:var(--radius-lg);border:1px dashed var(--color-neutral-800);display:grid;place-items:center;text-align:center;font:400 12px/1.5 Inter,sans-serif;color:var(--color-neutral-600)">${st.ukeDone?'That is the end. Nicely played.':'Last chord — let it ring.'}</div>`;

    // The bar you are in, as half-beat slots: an arrow where the pattern strums.
    const bar=P.barOf(p,w.t), off=w.t-bar, slots=[];
    for(let o=0;o<p.meter;o+=0.5){
      const hit=p.pattern.strokes.find(x=>Math.abs(x[0]-o)<1e-6);
      const now=(st.playing||st.armed)&&hit&&Math.abs(off-o)<1e-6&&st.uCi>=0;
      slots.push(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="height:30px;width:100%;max-width:34px;border-radius:var(--radius-sm);display:grid;place-items:center;font:600 17px Inter,sans-serif;background:${now?'var(--color-accent)':hit?'#2b2741':'transparent'};color:${now?'#171927':hit?'var(--color-accent-200)':'var(--color-neutral-800)'}">${hit?(hit[1]==='u'?'↑':'↓'):'·'}</div>
        <div style="font:500 9.5px ui-monospace,Menlo,monospace;color:${Number.isInteger(o)?'var(--color-neutral-500)':'var(--color-neutral-700)'}">${P.countLabel(o)}</div></div>`);
    }

    // This line's chords, as wide as they last, over its words.
    const lc=(s.lines[st.line]&&s.lines[st.line].chords)||[];
    const curIdx=w.ci>=0&&p.chords[w.ci].li===st.line?p.chords[w.ci].idx:-1;
    const chips=lc.map((e,idx)=>e.bar?'':`<div style="flex:${e.dur||1};min-width:0;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 8px;font:500 13.5px Inter,sans-serif;white-space:nowrap;overflow:hidden;border:1px solid ${idx===curIdx?'var(--color-accent)':'var(--color-neutral-800)'};background:${idx===curIdx?'#3b336b':'transparent'};color:${e.rest?'var(--color-neutral-700)':idx===curIdx?'#f5f4ff':'var(--color-neutral-400)'}">${e.rest?'–':esc(e.tok)}</div>`).join('');

    const modes=[['along','Play along'],['solo','On your own']];
    const strums=[['downs','All downs'],['pattern',P.patternFor(s.meter,'pattern').name]];
    const lineBusy=(st.playing&&st.playScope==='line')||(st.armed&&st.armScope==='line');
    const songBusy=(st.playing&&st.playScope==='song')||(st.armed&&st.armScope==='song');
    const hint=solo
      ?(st.armed?'Make the lit shape, strum it, then tap it. Nothing moves until you do.':'Practise a line and the chords wait for you: tap each one once it rings.')
      :'One bar is counted in. The app plays the tune and the click; you strum where the arrow lights.';
    const problems=p.problems.length?`<div style="margin-top:10px;font:400 11.5px/1.5 Inter,sans-serif;color:#e0c79a">Line ${p.problems[0].li+1}'s chords last ${p.problems[0].chords} beats but its tune lasts ${p.problems[0].melody}, so they will drift.</div>`:'';

    return `<div style="padding:0 16px 14px">
      <div style="display:flex;align-items:center;gap:10px">
        <button data-act="back" style="width:34px;height:34px;flex:none;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:var(--color-surface);color:var(--color-neutral-400);font-size:15px;cursor:pointer">‹</button>
        <div style="flex:1;min-width:0;text-align:center">
          <div style="font:500 13.5px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.title)}</div>
          <div style="font:400 10.5px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--color-neutral-600);margin-top:2px">${s.meter} · ${p.groups.length} changes · ${[...new Set(p.groups.map(g=>g.chord))].join(' ')}</div>
        </div>
        <div style="width:34px;flex:none"></div>
      </div>
      ${this.practiceInst()}

      <div style="display:flex;gap:10px;margin-top:12px;align-items:stretch">${hero}${upNext}</div>

      <div style="margin-top:12px;display:flex;align-items:flex-end;gap:2px">${slots.join('')}</div>

      <div style="margin-top:12px;display:flex;gap:4px">${chips}</div>
      <div style="font:400 12.5px/1.4 Inter,sans-serif;color:var(--color-neutral-500);margin-top:6px;text-align:center">${esc(s.lines[st.line]?s.lines[st.line].label:'')}</div>
      <div style="height:3px;border-radius:2px;background:#292b31;margin-top:9px;overflow:hidden"><div id="mf-beat" style="height:100%;background:var(--color-accent);border-radius:2px;transition:width .08s linear;width:${Math.round(st.beat*100)}%"></div></div>
      ${problems}

      <div style="margin-top:12px;display:flex;gap:5px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${this.seg(modes,st.ukeSong,'ukeSong')}</div>
      <div style="margin-top:6px;display:flex;gap:5px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${this.seg(strums,st.strum,'strum',)}</div>
      <div style="font:400 11px/1.5 Inter,sans-serif;color:var(--color-neutral-600);margin-top:8px;text-align:center;text-wrap:pretty">${hint}</div>
      <div style="display:flex;align-items:center;gap:11px;margin-top:10px">
        <span style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">Tempo</span>
        <input type="range" min="40" max="126" step="2" data-act="setTempo" value="${st.tempo}" style="flex:1">
        <span style="font:500 12px ui-monospace,Menlo,monospace;color:var(--color-accent-300);width:54px;text-align:right">${st.tempo} bpm</span>
      </div>
      <div style="display:flex;gap:9px;margin-top:11px">
        <button data-act="ukeListen" style="flex:1;height:44px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-300);font:500 14px Inter,sans-serif;cursor:pointer">Listen</button>
        <button data-act="ukeLine" style="flex:1.3;height:44px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:#2b2741;color:var(--color-accent-200);font:500 14px Inter,sans-serif;cursor:pointer">${lineBusy?'Stop':solo?'Practise line':'Play line'}</button>
      </div>
      <button data-act="ukeWhole" style="width:100%;height:40px;margin-top:8px;border-radius:var(--radius-md);border:1px solid var(--color-accent-700);background:${songBusy?'#423a6a':'transparent'};color:var(--color-accent-300);font:500 13px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px"><span style="font-size:11px">▶▶</span>${songBusy?'Stop':solo?'Practise song':'Play whole song'}</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px">
        <button data-act="prevLine" style="border:0;background:none;color:var(--color-neutral-600);font:500 12px Inter,sans-serif;cursor:pointer;padding:4px 2px">‹ previous line</button>
        <span style="font:400 11px ui-monospace,Menlo,monospace;color:var(--color-neutral-700)">${st.line+1} / ${s.lines.length}</span>
        <button data-act="nextLine" style="border:0;background:none;color:var(--color-accent-400);font:500 12px Inter,sans-serif;cursor:pointer;padding:4px 2px">next line ›</button>
      </div>
    </div>`;
  },

  instSwitch(){
    const st=this.state;
    return `<div style="display:flex;gap:5px;margin-top:2px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${
      this.seg([['drum','Tongue drum',32,12],['ukulele','Ukulele',32,12]],st.inst,'inst')}</div>`;
  },

  /* The ukulele surface. Two questions a learner actually has: where does
     this chord go, and how do I get to the next one in time. */
  screenUke(){
    const st=this.state, V=MF_FRETBOARD_VIEW, uke=MF.instrument('ukulele');
    const modes=[['changes','Changes',32,12],['chords','Chords',32,12],['drill','Drill',32,12]];
    const head=`<div style="padding:0 4px">
        <div style="font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--color-neutral-600)">Soprano · G C E A</div>
        <div style="font:500 25px/1.1 var(--font-heading);letter-spacing:-.02em;margin-top:6px">The ukulele</div>
      </div>
      ${this.instSwitch()}
      <div style="display:flex;gap:5px;margin-top:9px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${this.seg(modes,st.ukeMode,'ukeMode')}</div>`;

    let body='';
    if(st.ukeMode==='chords'){
      const shapes=uke.shapesFor(st.ukeChord);
      const chips=uke.tokens.map(c=>`<button data-act="ukeChord" data-v="${c}" style="height:32px;padding:0 11px;border-radius:var(--radius-sm);border:1px solid ${c===st.ukeChord?'var(--color-accent)':'var(--color-neutral-800)'};background:${c===st.ukeChord?'#3b336b':'var(--color-surface)'};color:${c===st.ukeChord?'#e7e5fe':'var(--color-neutral-400)'};font:500 12.5px Inter,sans-serif;cursor:pointer">${c}</button>`).join('');
      const main=shapes[0];
      const seen=new Set([shapes[0]&&shapes[0].frets.join()]);
      const alts=shapes.filter(x=>{ const k=x.frets.join(); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,3);
      body=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:13px">${chips}</div>
        <div data-act="hearChord" data-v="${st.ukeChord}" style="margin-top:14px;padding:14px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-900);background:var(--color-surface);cursor:pointer">
          <div style="max-width:190px;margin:0 auto">${main?V.chord(main,{}):''}</div>
          <div style="text-align:center;margin-top:6px;font:400 11.5px Inter,sans-serif;color:var(--color-neutral-600)">${main&&main.canonical?'The shape everyone learns':'The easiest shape found'} · tap to hear it</div>
        </div>
        ${alts.length?`<div style="margin-top:13px">
          <div style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">Other ways to play it</div>
          <div style="display:flex;gap:9px;margin-top:9px">${alts.map(a=>`<div style="flex:1;padding:8px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-900);background:var(--color-surface)">${V.chord(a,{label:false})}<div style="text-align:center;font:400 10px ui-monospace,Menlo,monospace;color:var(--color-neutral-600);margin-top:3px">${a.frets.join(' ')}</div></div>`).join('')}</div>
        </div>`:''}`;
    } else if(st.ukeMode==='drill'){
      const P=MF_PRACTICE, deck=this.deck(), target=P.targetMs(deck.bpm,deck.beats);
      const k=st.drillKey||P.next(deck), pair=this.drillPair(k);
      const worst=P.weakest(deck), ready=P.readiness(deck);
      const last=st.drillLast;
      const tempos=[[60,'60'],[75,'75'],[90,'90'],[110,'110'],[130,'130']]
        .map(t=>`<button data-act="drillBpm" data-v="${t[0]}" style="flex:1;height:30px;border-radius:var(--radius-sm);border:0;cursor:pointer;font:500 11.5px Inter,sans-serif;background:${deck.bpm===t[0]?'#423a6a':'transparent'};color:${deck.bpm===t[0]?'#e7e5fe':'#75798c'}">${t[1]}</button>`).join('');

      const verdictCol=last? (last.verdict==='good'?'#8fd0b4':last.verdict==='close'?'#e6ca9c':'#e0a8b0') : 'var(--color-neutral-600)';
      const verdictTxt=last? (last.verdict==='good'?'in time':last.verdict==='close'?'just late':'too slow') : '';

      body=`<div style="display:flex;align-items:center;gap:9px;margin-top:13px">
          <span style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600);flex:none">Aiming for</span>
          <div style="flex:1;display:flex;gap:4px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${tempos}</div>
        </div>
        <div style="margin-top:6px;font:400 11.5px/1.5 Inter,sans-serif;color:var(--color-neutral-600)">One bar at ${deck.bpm} is ${(target/1000).toFixed(1)}s. That is the change, not the chord.</div>

        <div style="margin-top:13px;padding:14px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-900);background:var(--color-surface)">
          ${pair?`<div style="display:flex;align-items:center;gap:10px">
            <div style="flex:none;width:76px;opacity:.5">${V.chord(pair[0],{label:pair[0].chord})}</div>
            <div style="flex:none;color:var(--color-neutral-700);font:400 16px Inter,sans-serif">→</div>
            <div data-act="drillTap" style="flex:1;min-width:0;cursor:pointer;border-radius:var(--radius-md);padding:6px;border:1px solid ${st.drillLive?'var(--color-accent)':'transparent'};background:${st.drillLive?'#241f3d':'transparent'}">${V.chord(pair[1],{from:pair[0],label:pair[1].chord})}</div>
          </div>`:'<div style="color:var(--color-neutral-500);font:400 13px Inter,sans-serif">Nothing to drill in this progression.</div>'}

          <div style="margin-top:11px;text-align:center;min-height:38px">
            ${st.drillLive
              ? `<div style="font:500 13px Inter,sans-serif;color:var(--color-accent-200)">Make the shape, then tap it.</div>
                 <div style="font:400 11px Inter,sans-serif;color:var(--color-neutral-600);margin-top:3px">The clock is running.</div>`
              : last
                ? `<div style="font:500 15px Inter,sans-serif;color:${verdictCol}">${(last.ms/1000).toFixed(1)}s · ${verdictTxt}</div>
                   <div style="font:400 11px Inter,sans-serif;color:var(--color-neutral-600);margin-top:3px">${esc(last.key.replace('>',' → '))}</div>`
                : `<div style="font:400 12px Inter,sans-serif;color:var(--color-neutral-600);text-wrap:pretty">Hold the first shape. Start when you are ready, change on the tap.</div>`}
          </div>

          <button data-act="${st.drillLive?'drillTap':'drillGo'}" style="width:100%;height:42px;margin-top:4px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:${st.drillLive?'var(--color-accent)':'transparent'};color:${st.drillLive?'#171927':'var(--color-accent-200)'};font:600 13.5px Inter,sans-serif;cursor:pointer">${st.drillLive?'I have it':(last?'Next change':'Start')}</button>
        </div>

        <div style="margin-top:13px;padding:13px 14px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-900);background:var(--color-surface)">
          <div style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">What is in your way</div>
          ${worst.length? `<div style="margin-top:10px;display:flex;flex-direction:column;gap:7px">${worst.map(c=>`
            <div style="display:flex;align-items:center;gap:9px">
              <span style="flex:none;width:74px;font:500 12.5px Inter,sans-serif;color:${c.ready?'var(--color-neutral-500)':'#e2e5f0'}">${esc(c.from)} → ${esc(c.to)}</span>
              <div style="flex:1;height:6px;border-radius:3px;background:#292b31;overflow:hidden"><div style="height:100%;width:${Math.min(100,Math.round((c.pace/(target*2))*100))}%;background:${c.ready?'#8fd0b4':'#9184d9'}"></div></div>
              <span style="flex:none;font:400 11px ui-monospace,Menlo,monospace;color:${c.ready?'#8fd0b4':'var(--color-neutral-500)'}">${(c.pace/1000).toFixed(1)}s</span>
            </div>`).join('')}</div>
            <div style="margin-top:11px;font:400 12px/1.55 Inter,sans-serif;color:var(--color-neutral-500);text-wrap:pretty">${ready.blocker
              ? `${ready.ready} of ${ready.total} changes are in time at ${deck.bpm}. <span style="color:#e2e5f0">${esc(ready.blocker.from)} → ${esc(ready.blocker.to)}</span> is what is holding the tempo down.`
              : ready.tried<ready.total? `${ready.ready} of ${ready.total} in time. ${ready.total-ready.tried} not tried yet.`
              : `Every change is inside the bar at ${deck.bpm}. Put the tempo up.`}</div>`
          : '<div style="margin-top:9px;font:400 12.5px/1.6 Inter,sans-serif;color:var(--color-neutral-500);text-wrap:pretty">Nothing measured yet. The drill keeps your times per change and comes back to the slow ones — it is the changes that hold a song back, not the chords.</div>'}
        </div>`;
    } else {
      const prog=this.prog(), solved=this.progPath();
      const picks=PROGS.map(p=>`<button data-act="prog" data-v="${p.id}" style="height:30px;padding:0 11px;border-radius:var(--radius-sm);border:1px solid ${p.id===st.progId?'var(--color-accent)':'var(--color-neutral-800)'};background:${p.id===st.progId?'#3b336b':'var(--color-surface)'};color:${p.id===st.progId?'#e7e5fe':'var(--color-neutral-400)'};font:500 11.5px Inter,sans-serif;cursor:pointer;white-space:nowrap">${esc(p.name)}</button>`).join('');
      if(!solved){ body='<div style="margin-top:14px;color:var(--color-neutral-500);font:400 13px Inter,sans-serif">That progression has a chord this fretboard cannot reach.</div>'; }
      else{
        const i=Math.min(Math.max(st.step,1),solved.shapes.length-1);
        const from=solved.shapes[i-1], to=solved.shapes[i];
        const cost=MF_FRETBOARD.transitionCost(from,to);
        const ladder=solved.shapes.map((sh,k)=>`<span style="font:500 12.5px Inter,sans-serif;color:${k===i||k===i-1?'#e7e5fe':'var(--color-neutral-700)'}">${sh.chord}</span>`).join('<span style="color:var(--color-neutral-800);margin:0 6px">→</span>');
        body=`<div style="display:flex;gap:6px;margin-top:13px;overflow-x:auto;padding-bottom:2px">${picks}</div>
          <div style="margin-top:6px;font:400 11.5px/1.5 Inter,sans-serif;color:var(--color-neutral-600);text-wrap:pretty">${esc(prog.sub)}</div>
          <div style="margin-top:13px;padding:14px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-900);background:var(--color-surface)">
            <div style="text-align:center;margin-bottom:11px">${ladder}</div>
            ${V.change(from,to,{cost})}
            <div style="display:flex;gap:8px;margin-top:13px">
              <button data-act="stepBack" style="flex:none;width:40px;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:transparent;color:var(--color-neutral-400);cursor:pointer">‹</button>
              <button data-act="hearChange" style="flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:transparent;color:var(--color-accent-200);font:500 12.5px Inter,sans-serif;cursor:pointer">Hear the change</button>
              <button data-act="stepOn" style="flex:none;width:40px;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:transparent;color:var(--color-neutral-400);cursor:pointer">›</button>
            </div>
          </div>
          <div style="margin-top:12px;font:400 12.5px/1.6 Inter,sans-serif;color:var(--color-neutral-500);text-wrap:pretty">Shapes are chosen for the whole progression, not one chord at a time, so the fingers that can stay down do. A mint finger is already where it needs to be — leave it there.</div>`;
      }
    }
    return `<div style="padding:0 16px 14px">${head}${body}</div>`;
  },

  screenDrum(){
    if(this.state.inst==='ukulele') return this.screenUke();
    const st=this.state;
    const rotSteps=Math.round((PROPS.drumRotation+st.rot)/30);
    const pads=this.padList({dim:st.drumMode==='drone'?PENT:null,rot:rotSteps,px:334});
    const drumModes=[['free','Free play',32,12],['drone','Improvise',32,12],['layout','Layout',32,12]];
    const blurb=st.drumMode==='free'?'Every pad, no lesson and no scoring. Numbers are as engraved: a dot under is the low octave, a dot over is the high one.'
      :st.drumMode==='drone'?'A drone on 1 underneath, and the pentatonic pads lifted forward.'
      :'The saved layout for this drum. Centre pad first, then clockwise from twelve.';
    let extra='';
    if(st.drumMode==='layout'){
      extra=`<div style="margin-top:12px;padding:12px 13px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:var(--color-surface)">
        <div style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">Centre, then clockwise</div>
        <div style="font:400 13px/1.7 ui-monospace,Menlo,monospace;color:var(--color-accent-300);margin-top:8px;letter-spacing:.06em">5. · ${RING.join(' ')}</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button style="flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:transparent;color:var(--color-accent-200);font:500 12.5px Inter,sans-serif;cursor:pointer">Add a drum</button>
          <button style="flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-400);font:500 12.5px Inter,sans-serif;cursor:pointer">Copy layout</button>
        </div></div>`;
    } else if(st.drumMode==='drone'){
      extra=`<div style="display:flex;align-items:center;gap:11px;margin-top:12px">
        <button data-act="toggleDrone" style="flex:none;height:36px;padding:0 14px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:transparent;color:var(--color-accent-200);font:500 12.5px Inter,sans-serif;cursor:pointer">${st.drone?'Stop the drone':'Start the drone'}</button>
        <span style="font:400 11.5px/1.45 Inter,sans-serif;color:var(--color-neutral-600)">Dimmed pads sit outside the pentatonic. Nothing you hit sounds wrong.</span></div>`;
    }
    return `<div style="padding:0 16px 14px">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px">
        <div>
          <div style="font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--color-neutral-600)">My 13 · C major</div>
          <div style="font:500 25px/1.1 var(--font-heading);letter-spacing:-.02em;margin-top:6px">The drum</div>
        </div>
        <div style="display:flex;gap:6px">
          <button data-act="rotL" style="width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:var(--color-surface);color:var(--color-neutral-400);cursor:pointer;font-size:14px">↺</button>
          <button data-act="rotR" style="width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:var(--color-surface);color:var(--color-neutral-400);cursor:pointer;font-size:14px">↻</button>
        </div>
      </div>
      ${this.instSwitch()}
      <div style="display:flex;gap:5px;margin-top:9px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${this.seg(drumModes,st.drumMode,'drumMode')}</div>
      <div style="padding:12px 0">${this.wheel(pads,'min(86vw, 336px)')}</div>
      <div style="padding:0 2px 12px">
        <div style="font:400 12.5px/1.6 Inter,sans-serif;color:var(--color-neutral-500);text-wrap:pretty">${blurb}</div>
        ${extra}
      </div>
    </div>`;
  },

  screenCapture(){
    const st=this.state;
    const recLabel=st.rec==='listening'?'Listening':'Record';
    const recHint=st.rec==='listening'?'play or hum the phrase':st.hasCap?'tap to record again':'four bars is plenty';
    const recGlow=st.rec==='listening'?'0 0 0 10px rgba(145,132,217,.10), 0 0 48px rgba(145,132,217,.34)':'none';
    const bars=Array.from({length:13},(_,i)=>`<div style="width:4px;height:40px;border-radius:2px;background:${st.rec==='listening'?'#9184d9':'#3f424d'};transform-origin:50% 100%;animation:${st.rec==='listening'?'mfLevel '+(520+(i%5)*130)+'ms ease-in-out '+(i*60)+'ms infinite':'none'}"></div>`).join('');
    const recents=[{name:'Kitchen radio hook',notes:'3 3 4 5 | 5 4 3 2',when:'yesterday'},{name:'Something in 3',notes:'5 .1*2 | 7 .1 5',when:'Tue'}];
    const capBlock=st.hasCap?`<div style="margin-top:20px;padding:14px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-800);background:var(--color-surface)">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <div style="font:500 14px Inter,sans-serif">Heard 11 notes</div>
          <div style="font:400 11px ui-monospace,Menlo,monospace;color:var(--color-neutral-600)">≈ 84 bpm · 4/4</div>
        </div>
        <div style="font:400 12.5px/1.6 Inter,sans-serif;color:var(--color-neutral-500);margin-top:7px;text-wrap:pretty">Two notes came back uncertain — they are dashed in the editor. One sat outside your drum and has been snapped to the nearest pad.</div>
        <div style="font:400 19px/1.9 ui-monospace,Menlo,monospace;color:var(--color-accent-300);margin-top:9px;letter-spacing:.08em;word-break:break-word">1 1 5 5 | 6 6 5*2 | 4 4 3*2</div>
        <div style="display:flex;gap:8px;margin-top:13px">
          <button data-act="playCapture" style="flex:1;height:40px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-300);font:500 13px Inter,sans-serif;cursor:pointer">Hear it back</button>
          <button data-act="editCapture" style="flex:1.2;height:40px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:#2b2741;color:var(--color-accent-200);font:500 13px Inter,sans-serif;cursor:pointer">Fix and save</button>
        </div></div>`:'';
    return `<div style="padding:0 20px">
      <div style="font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--color-neutral-600)">Hum it, play it, or hold up a speaker</div>
      <div style="font:500 27px/1.1 var(--font-heading);letter-spacing:-.02em;margin-top:7px">Capture</div>
      <p style="font:400 13px/1.65 Inter,sans-serif;color:var(--color-neutral-500);margin:11px 0 0;text-wrap:pretty">Anything you can hum becomes numbers you can play. What comes back is a draft — you correct it before it enters the book.</p>
      <div style="margin-top:22px;display:grid;place-items:center;gap:16px">
        <button data-act="toggleRec" style="width:132px;height:132px;border-radius:50%;border:1px solid var(--color-accent);background:radial-gradient(circle at 50% 38%,#2b2741,#232532);cursor:pointer;display:grid;place-items:center;color:var(--color-accent-200);box-shadow:${recGlow};transition:box-shadow .3s">
          <span style="font:500 15px Inter,sans-serif">${recLabel}</span>
        </button>
        <div style="display:flex;align-items:flex-end;gap:4px;height:40px">${bars}</div>
        <div style="font:400 12px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--color-neutral-600)">${recHint}</div>
      </div>
      ${capBlock}
      <div style="margin-top:20px;font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">Recent captures</div>
      <div style="display:flex;flex-direction:column;gap:7px;margin-top:10px">
        ${recents.map(r=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-900);background:var(--color-surface)">
          <div style="flex:1;min-width:0"><div style="font:500 13.5px Inter,sans-serif">${esc(r.name)}</div><div style="font:400 11.5px ui-monospace,Menlo,monospace;color:var(--color-neutral-600);margin-top:3px">${esc(r.notes)}</div></div>
          <span style="font:400 11px Inter,sans-serif;color:var(--color-neutral-700)">${esc(r.when)}</span></div>`).join('')}
      </div>
      <div style="height:16px"></div>
    </div>`;
  },

  screenEditor(){
    const st=this.state, en=st.edNotes, sel=en[st.sel]||{};
    const chips=en.map((n,i)=>{
      if(n.bar) return `<div style="flex:none;width:10px;height:52px;display:grid;place-items:center;font-size:17px;color:var(--color-accent-800)">|</div>`;
      const q=n.pad?parts(n.pad):{num:'0',up:false,dn:false};
      const on=i===st.sel;
      const bg=on?'#423a6a':'#232532', bc=on?A:n.uncertain?'#796cbf':'#3f424d', bs=(n.uncertain&&!on)?'dashed':'solid', fg=on?'#f5f4ff':'#9397ab';
      return `<button data-act="selNote" data-i="${i}" style="flex:none;min-width:46px;height:52px;border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1px ${bs} ${bc};background:${bg};color:${fg}">
        <div style="display:flex;align-items:flex-start;gap:2px;line-height:.9;font:500 21px var(--font-heading)"><span>${q.num}</span>${q.up?'<span style="font-size:9px;line-height:1">•</span>':''}${q.dn?'<span style="font-size:9px;line-height:1;align-self:flex-end">•</span>':''}</div>
        <div style="font:600 8px ui-monospace,Menlo,monospace;letter-spacing:.1em;opacity:.65">${lenLabel(n.dur)}</div>
      </button>`;
    }).join('');
    const selKicker=sel.rest?'Rest selected':'Note '+(en.slice(0,st.sel).filter(n=>!n.bar).length+1)+' of '+en.filter(n=>!n.bar).length;
    const selPad=sel.rest?'0':(sel.pad||'–'), selNote=sel.rest?'silence':(NAMES[sel.pad]||'');
    const lengths=[0.5,1,1.5,2].map(d=>{
      const label=d===0.5?'½':d===1.5?'1½':String(d);
      return `<button data-act="setLen" data-v="${d}" style="flex:1;height:38px;border-radius:var(--radius-md);cursor:pointer;font:500 12.5px ui-monospace,Menlo,monospace;border:1px solid ${sel.dur===d?A:'#595d6c'};background:${sel.dur===d?'#423a6a':'transparent'};color:${sel.dur===d?'#f5f4ff':'#9397ab'}">${label}</button>`;
    }).join('');
    return `<div style="display:flex;flex-direction:column;height:100%;padding:0 16px">
      <div style="display:flex;align-items:center;gap:10px">
        <button data-act="back" style="width:34px;height:34px;flex:none;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);background:var(--color-surface);color:var(--color-neutral-400);font-size:15px;cursor:pointer">‹</button>
        <div style="flex:1;min-width:0;text-align:center">
          <div data-act="rename" style="font:500 13.5px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer">${esc(st.edTitle)} <span style="color:var(--color-neutral-600);font-size:11px">✎</span></div>
          <div style="font:400 10.5px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--color-neutral-600);margin-top:2px">${esc(st.edSub)}</div>
        </div>
        <button data-act="saveEdit" style="height:34px;flex:none;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:#2b2741;color:var(--color-accent-200);font:500 12px Inter,sans-serif;cursor:pointer">Save</button>
      </div>
      <div style="margin-top:15px;font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">Tap a note to correct it</div>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;max-height:190px;overflow:auto">${chips}</div>
      <div style="flex:1;min-height:8px"></div>
      <div style="margin-bottom:10px;padding:13px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-800);background:var(--color-surface)">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--color-neutral-600)">${selKicker}</div>
          <button data-act="hearSel" style="border:0;background:none;color:var(--color-accent-400);font:500 11.5px Inter,sans-serif;cursor:pointer">hear it</button>
        </div>
        <div style="display:flex;align-items:center;gap:11px;margin-top:11px">
          <button data-act="pitchDown" style="width:44px;height:44px;flex:none;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-300);font-size:17px;cursor:pointer">−</button>
          <div style="flex:1;height:44px;border-radius:var(--radius-md);border:1px solid var(--color-accent-700);background:#2b2741;display:flex;align-items:center;justify-content:center;gap:9px">
            <span style="font:500 21px var(--font-heading);color:var(--color-accent-200)">${selPad}</span>
            <span style="font:400 11.5px ui-monospace,Menlo,monospace;color:var(--color-accent-400)">${selNote}</span>
          </div>
          <button data-act="pitchUp" style="width:44px;height:44px;flex:none;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-300);font-size:17px;cursor:pointer">+</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:9px">${lengths}</div>
        <div style="display:flex;gap:6px;margin-top:7px">
          <button data-act="makeRest" style="flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-400);font:500 12px Inter,sans-serif;cursor:pointer">Rest</button>
          <button data-act="dupNote" style="flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-400);font:500 12px Inter,sans-serif;cursor:pointer">Duplicate</button>
          <button data-act="delNote" style="flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-700);background:transparent;color:var(--color-neutral-400);font:500 12px Inter,sans-serif;cursor:pointer">Delete</button>
        </div>
        <div style="height:1px;background:var(--color-neutral-800);margin:12px 0"></div>
        <div style="display:flex;align-items:center;gap:11px">
          <button data-act="tapTempo" style="flex:none;height:40px;padding:0 15px;border-radius:var(--radius-md);border:1px solid var(--color-accent);background:transparent;color:var(--color-accent-200);font:500 12.5px Inter,sans-serif;cursor:pointer">Tap the beat</button>
          <span style="font:400 11.5px/1.45 Inter,sans-serif;color:var(--color-neutral-600);flex:1">${esc(st.tapMsg)}</span>
        </div>
      </div>
    </div>`;
  },

  screenBook(){
    const st=this.state;
    const bookTabs=[['score','Arrangements',32,12],['mine','Your songs',32,12],['reg','Register',32,12]];
    let body='';
    if(st.book==='score'){
      body=`<div style="display:flex;flex-direction:column;gap:12px;margin-top:15px">
        ${SONGS.slice(0,4).map(x=>`<div style="padding:14px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-900);background:var(--color-surface)">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
            <div style="font:500 15px Inter,sans-serif">${esc(x.title)}</div>
            <button data-act="scoreEdit" data-id="${x.id}" style="border:0;background:none;color:var(--color-accent-400);font:500 11.5px Inter,sans-serif;cursor:pointer;flex:none">edit</button>
          </div>
          <div style="font:400 10.5px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--color-neutral-600);margin-top:3px">${esc(x.cat)} · ${x.bpm} bpm · ${x.meter}</div>
          <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
            ${x.lines.map(l=>{
              const notes=l.notes.map(n=>n.bar?'|':(n.rest?'0':n.pad)+(n.dur===1?'':'*'+n.dur)).join(' ');
              return `<div style="display:flex;gap:11px;align-items:baseline">
                <div style="flex:none;width:92px;font:400 10.5px/1.4 Inter,sans-serif;color:var(--color-neutral-700);text-align:right">${esc(l.label)}</div>
                <div style="flex:1;min-width:0"><div style="font:400 13.5px/1.5 ui-monospace,Menlo,monospace;color:var(--color-accent-300);letter-spacing:.05em">${esc(notes)}</div>${
                  l.chords&&l.chords.length?`<div style="font:400 11.5px/1.5 ui-monospace,Menlo,monospace;color:#8fd0b4;letter-spacing:.05em">${esc(MF_SONGBOOK.write(l.chords))}</div>`:''}</div></div>`;
            }).join('')}
          </div></div>`).join('')}
      </div>`;
    } else if(st.book==='mine'){
      const mine=SONGS.filter(x=>x.custom||x.edited);
      const btn='flex:1;height:40px;border-radius:var(--radius-md);font:500 13px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center';
      body=`<div style="margin-top:15px;padding:14px;border-radius:var(--radius-lg);border:1px solid var(--color-neutral-800);background:var(--color-surface)">
          <div style="font:400 12.5px/1.6 Inter,sans-serif;color:var(--color-neutral-500);text-wrap:pretty">Songs you write or correct live on this phone. Save a copy somewhere safe — Files, email, a cloud drive — so a new phone or a reinstall does not lose them. The copy includes your drill times.</div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button data-act="exportBook" style="${btn};border:1px solid var(--color-accent);background:#2b2741;color:var(--color-accent-200)">Save a copy</button>
            <label style="${btn};border:1px solid var(--color-neutral-700);color:var(--color-neutral-300)">Load a copy<input type="file" accept="application/json,.json" data-act="importFile" style="display:none"></label>
          </div>
          ${st.bookMsg?`<div style="margin-top:10px;font:400 12px/1.5 Inter,sans-serif;color:var(--color-accent-300)">${esc(st.bookMsg)}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:7px;margin-top:13px">
          ${mine.length?mine.map(x=>`<div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-900);background:var(--color-surface)">
            <button data-act="openSong" data-id="${x.id}" style="flex:1;min-width:0;text-align:left;border:0;background:none;color:inherit;cursor:pointer;padding:0">
              <div style="font:500 13.5px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.title)}</div>
              <div style="font:400 11px Inter,sans-serif;color:var(--color-neutral-600);margin-top:3px">${x.custom?'Yours':'Your correction of a built-in song'} · ${x.lines.length} line${x.lines.length===1?'':'s'}</div>
            </button>
            <button data-act="${x.custom?'deleteSong':'restoreSong'}" data-id="${x.id}" style="flex:none;border:0;background:none;color:var(--color-neutral-600);font:500 11.5px Inter,sans-serif;cursor:pointer">${x.custom?'delete':'restore'}</button>
          </div>`).join(''):`<div style="font:400 12.5px/1.6 Inter,sans-serif;color:var(--color-neutral-600);text-wrap:pretty">Nothing here yet. Edit a song and save it, or capture one — it will appear here.</div>`}
        </div>`;
    } else {
      body=`<div style="display:flex;flex-direction:column;gap:8px;margin-top:15px">
        ${REGISTER.map(r=>{
          const bc=VC[r.v][0], fg=VC[r.v][1];
          return `<div style="padding:13px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-900);background:var(--color-surface)">
            <div style="display:flex;align-items:center;gap:9px">
              <span style="flex:none;font:600 8.5px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:var(--radius-sm);border:1px solid ${bc};color:${fg}">${r.v}</span>
              <span style="font:500 13.5px Inter,sans-serif;flex:1;min-width:0">${esc(r.t)}</span>
            </div>
            <div style="font:400 12px/1.6 Inter,sans-serif;color:var(--color-neutral-500);margin-top:7px;text-wrap:pretty">${esc(r.r)}</div></div>`;
        }).join('')}
      </div>`;
    }
    return `<div style="padding:0 20px">
      <div style="font:600 9.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--color-neutral-600)">Every arrangement, and why it is here</div>
      <div style="font:500 27px/1.1 var(--font-heading);letter-spacing:-.02em;margin-top:7px">The book</div>
      <div style="display:flex;gap:5px;margin-top:15px;padding:3px;border-radius:var(--radius-md);background:#292b31;border:1px solid var(--color-neutral-800)">${this.seg(bookTabs,st.book,'book')}</div>
      ${body}
      <div style="height:16px"></div>
    </div>`;
  },

  tabbar(){
    const st=this.state;
    const tabs=[['play','Play','◉'],['drum',st.inst==='ukulele'?'Ukulele':'Drum','◍'],['capture','Capture','◐'],['book','Book','▤']];
    return tabs.map(t=>`<button data-act="tab" data-v="${t[0]}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;cursor:pointer;padding:4px 0;color:${st.tab===t[0]?'#d2cefd':'#595d6c'}">
      <span style="font-size:16px;line-height:1">${t[2]}</span><span style="font:500 10px Inter,sans-serif">${t[1]}</span></button>`).join('');
  },

  render(){
    const st=this.state;
    let html='';
    switch(st.screen){
      case 'library': html=this.screenLibrary(); break;
      case 'practice': html=(st.inst==='ukulele'&&this.hasUke(this.song()))?this.screenUkePractice():this.screenPractice(); break;
      case 'drum': html=this.screenDrum(); break;
      case 'capture': html=this.screenCapture(); break;
      case 'editor': html=this.screenEditor(); break;
      case 'book': html=this.screenBook(); break;
    }
    document.getElementById('scroll').innerHTML=html;
    document.getElementById('tabbar').innerHTML=this.tabbar();
    this.renderToast();
  },
  renderToast(){
    const el=document.getElementById('toast'); if(!el) return;
    const m=this.state.toast;
    el.innerHTML=m?`<div style="padding:8px 14px;border-radius:999px;background:#3b336b;border:1px solid var(--color-accent);color:#f5f4ff;font:500 12.5px Inter,sans-serif;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)">${esc(m)}</div>`:'';
  },

  /* ---- action dispatch (event delegation; avoids id lookups entirely) ---- */
  dispatch(act,ds,ev){
    const st=this.state, s=this.song();
    switch(act){
      case 'tab': this.stop(); this.setState({tab:ds.v,screen:ds.v==='play'?'library':ds.v}); break;
      case 'goDrums': this.setState({tab:'drum',screen:'drum',drumMode:'layout'}); break;
      case 'resume': this.setState({screen:'practice'}); break;
      case 'filter': this.setState({filter:ds.v}); break;
      case 'openSong': this.stop(); this.setState({songId:ds.id,line:0,screen:'practice',cur:-1}); break;
      case 'back': this.stop(); this.setState({screen:st.tab==='play'?'library':st.tab}); break;
      case 'editThis': this.openEditor(s.title,s.lines[st.line].notes,'Line '+(st.line+1)+' · '+s.meter,{kind:'line',songId:s.id,line:st.line}); break;
      case 'playInst': this.stop(); this.setState({inst:ds.v}); break;
      case 'ukeSong': this.stop(); this.setState({ukeSong:ds.v}); break;
      case 'strum': this.stop(); this.setState({strum:ds.v}); break;
      case 'ukeTap': this.ukeTap(); break;
      case 'ukeListen': if(st.playing) this.stop(); else this.runUke('line','listen'); break;
      case 'ukeLine':
        if(st.ukeSong==='solo'){ if(st.armed) this.stop(); else this.startUkeSolo('line'); }
        else if(st.playing) this.stop(); else this.runUke('line','along');
        break;
      case 'ukeWhole':
        if(st.ukeSong==='solo'){ if(st.armed) this.stop(); else { this.setState({line:0,uCi:-1}); this.startUkeSolo('song'); } }
        else if(st.playing) this.stop(); else { this.setState({line:0,uCi:-1}); this.runUke('song','along'); }
        break;
      case 'rename': { const t=window.prompt('Name this song',st.edTitle); if(t&&t.trim()) this.setState({edTitle:t.trim().slice(0,80)}); } break;
      case 'exportBook': this.exportBook(); break;
      case 'importFile': this.importBook(ev.target.files&&ev.target.files[0]); ev.target.value=''; break;
      case 'restoreSong': { const id=ds.id||s.id, x=SONGS.find(y=>y.id===id);
          if(x&&window.confirm('Put “'+x.title+'” back the way it came? Your changes to it will be lost.')){
            this.saved=(this.saved||[]).filter(y=>y.id!==id); this.saveSongs(); this.render(); this.flash('Restored the original.'); } } break;
      case 'deleteSong': { const x=SONGS.find(y=>y.id===ds.id);
          if(x&&window.confirm('Delete “'+x.title+'” from your songbook?')){
            this.saved=(this.saved||[]).filter(y=>y.id!==ds.id); this.saveSongs();
            if(st.songId===ds.id) this.setState({songId:'twinkle',line:0}); else this.render(); } } break;
      case 'strike': this.strike(ds.pad); break;
      case 'mode': this.stop(); this.setState({mode:ds.v}); break;
      case 'setTempo': this.setState({tempo:+ev.target.value}); break;
      case 'listen': this.stop(); setTimeout(()=>this.run(this.itemsForLine(st.line),Math.round(st.tempo*0.8),'line'),60); break;
      case 'playLine':
        if(st.mode==='solo'){ if(st.armed) this.stop(); else this.startSolo('line'); }
        else if(st.playing){ this.stop(); } else { this.run(this.itemsForLine(st.line),st.tempo,'line',st.mode==='notes'); }
        break;
      case 'playSong':
        if(st.mode==='solo'){ if(st.armed) this.stop(); else this.startSolo('song'); }
        else if(st.playing){ this.stop(); } else { this.setState({line:0}); setTimeout(()=>this.run(this.itemsForSong(),st.tempo,'song',st.mode==='notes'),40); }
        break;
      case 'prevLine': this.stop(); this.setState({line:Math.max(0,st.line-1),cur:-1}); break;
      case 'nextLine': this.stop(); this.setState({line:Math.min(s.lines.length-1,st.line+1),cur:-1}); break;
      case 'drumMode': this.setState({drumMode:ds.v}); break;
      case 'inst': this.stop(); this.setState({inst:ds.v,tab:'drum',screen:'drum'}); break;
      case 'ukeMode': this.setState({ukeMode:ds.v}); break;
      case 'ukeChord': this.setState({ukeChord:ds.v}); this.playToken('ukulele',ds.v); break;
      case 'hearChord': this.playToken('ukulele',ds.v); break;
      case 'prog': this.setState({progId:ds.v,step:1,drillKey:null,drillLive:false,drillLast:null}); break;
      case 'drillBpm': this.setState({drillBpm:+ds.v}); break;
      case 'drillGo': this.drillNext(); break;
      case 'drillTap': this.drillTap(); break;
      case 'stepBack': { const n=this.progPath(); if(n) this.setState({step:Math.max(1,st.step-1)}); } break;
      case 'stepOn': { const n=this.progPath(); if(n) this.setState({step:Math.min(n.shapes.length-1,st.step+1)}); } break;
      case 'hearChange': { // the shape you leave, then the one you arrive at
        const n=this.progPath(); if(!n) break;
        const i=Math.min(Math.max(st.step,1),n.shapes.length-1);
        this.playToken('ukulele',n.shapes[i-1].chord);
        setTimeout(()=>this.playToken('ukulele',n.shapes[i].chord,'d'),850);
      } break;
      case 'rotL': this.setState({rot:st.rot-30}); break;
      case 'rotR': this.setState({rot:st.rot+30}); break;
      case 'toggleDrone': { const on=!st.drone; this.setState({drone:on}); if(on) this.tone(hz('1')/2,7); } break;
      case 'toggleRec': if(st.rec!=='listening'){ this.setState({rec:'listening',hasCap:false});
          setTimeout(()=>this.setState({rec:'idle',hasCap:true}),3000); } break;
      case 'playCapture': this.stop(); setTimeout(()=>this.run(this.capNotes().map((n,idx)=>({n,li:0,idx})).filter(x=>!x.n.bar),84,'line'),60); break;
      case 'editCapture': { const n=this.capNotes().map(x=>Object.assign({},x)); if(n[6])n[6].uncertain=true; if(n[10])n[10].uncertain=true;
          this.openEditor('Untitled capture',n,'11 notes · ≈84 bpm',{kind:'capture'}); } break;
      case 'selNote': { const i=+ds.i; this.setState({sel:i}); const nn=st.edNotes[i]; if(nn&&nn.pad) this.tone(hz(nn.pad),1.3); } break;
      case 'hearSel': { const sel=st.edNotes[st.sel]; if(sel&&sel.pad) this.tone(hz(sel.pad),1.5); } break;
      case 'pitchUp': this.patch((ns,i)=>{ const k=ORDER.indexOf(ns[i]&&ns[i].pad); if(k>=0&&k<12){ ns[i]={pad:ORDER[k+1],dur:ns[i].dur}; this.tone(hz(ORDER[k+1]),1.2); } }); break;
      case 'pitchDown': this.patch((ns,i)=>{ const k=ORDER.indexOf(ns[i]&&ns[i].pad); if(k>0){ ns[i]={pad:ORDER[k-1],dur:ns[i].dur}; this.tone(hz(ORDER[k-1]),1.2); } }); break;
      case 'setLen': { const d=+ds.v; this.patch((ns,i)=>{ if(ns[i]) ns[i]=Object.assign({},ns[i],{dur:d}); }); } break;
      case 'makeRest': this.patch((ns,i)=>{ if(ns[i]) ns[i]={rest:true,dur:ns[i].dur}; }); break;
      case 'dupNote': this.patch((ns,i)=>{ if(ns[i]) ns.splice(i+1,0,Object.assign({},ns[i])); }); break;
      case 'delNote': { const ns=st.edNotes.slice(); ns.splice(st.sel,1); this.setState({edNotes:ns,sel:Math.max(0,st.sel-1)}); } break;
      case 'saveEdit': this.saveEdit(); break;
      case 'tapTempo': {
        const now=performance.now();
        this._taps=(this._taps||[]).filter(t=>now-t<2600); this._taps.push(now);
        if(this._taps.length>1){
          const g=this._taps.slice(1).map((t,k)=>t-this._taps[k]);
          const avg=g.reduce((a,b)=>a+b,0)/g.length;
          this.setState({tapMsg:Math.round(60000/avg)+' bpm from '+this._taps.length+' taps. Keep going, or Save to re-bar the line.'});
        } else this.setState({tapMsg:'Keep tapping…'});
      } break;
      case 'book': this.setState({book:ds.v}); break;
      case 'scoreEdit': { const x=SONGS.find(y=>y.id===ds.id); if(x) this.openEditor(x.title,x.lines[0].notes,'Line 1 · '+x.meter,{kind:'line',songId:x.id,line:0}); } break;
    }
  },

  init(){
    this.load();
    const root=document.getElementById('phone');
    const handle=(ev,useChange)=>{
      const el=ev.target.closest&&ev.target.closest('[data-act]');
      if(!el) return;
      const act=el.getAttribute('data-act');
      // range control fires on 'change'; everything else on 'click'
      const isRange=el.tagName==='INPUT';
      if(useChange!==isRange) return;
      const ds={ v:el.getAttribute('data-v'), id:el.getAttribute('data-id'),
                 pad:el.getAttribute('data-pad'), i:el.getAttribute('data-i') };
      this.dispatch(act,ds,ev);
    };
    root.addEventListener('click',e=>handle(e,false));
    root.addEventListener('change',e=>handle(e,true));
    this.render();
  }
};

window.App = App; // exposed for console debugging
window.addEventListener('DOMContentLoaded',()=>App.init());

/* register the service worker for offline use (ignored on file://) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
}
</script>
</body>
</html>
